# Odoo 17 Community untuk wireframe (addon tipis berisi data rekaan, bukan addon asli).
# Dipakai lewat build.sh; alur lengkap di wireframe-CLAUDE.md (root repo).
name: labfik-wireframe
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - wf-db:/var/lib/postgresql/data
  odoo:
    image: odoo:17
    depends_on: [db]
    ports: ["8069:8069"]
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - ${WF_ADDONS_DIR:-../../prototipe}:/mnt/extra-addons:ro
      - wf-data:/var/lib/odoo
    command: ["--", "--addons-path=/mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons", "-d", "${WF_DB:-labfik_wf}", "--db-filter=^${WF_DB:-labfik_wf}$$", "--without-demo=all"]
volumes:
  wf-db:
  wf-data:
