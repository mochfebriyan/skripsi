# Odoo 17 Community untuk wireframe modul Tata Kelola (data rekaan, bukan addon asli).
# Pemakaian: lihat README.md di folder ini.
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
      POSTGRES_DB: postgres
    volumes:
      - wf-db:/var/lib/postgresql/data
  odoo:
    image: odoo:17
    depends_on: [db]
    ports: ["8069:8069"]
    environment:
      HOST: db
      USER: odoo
      PASSWORD: odoo
    volumes:
      - ./:/mnt/extra-addons:ro
      - wf-data:/var/lib/odoo
    command: ["--", "--addons-path=/mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons", "-d", "labfik_wf", "--db-filter=^labfik_wf$$", "--without-demo=all"]
volumes:
  wf-db:
  wf-data:
